// Top-level build file where you can add configuration options common to all sub-projects/modules.
//
// Toolchain modernization (see MODERNIZATION.md): moved off the retired
// jcenter() and AGP 2.3.2 to AGP 7.4.2 on google()/mavenCentral(). This is a
// build-tooling-only bump: the app stays on the legacy android.support library
// (compileSdk/targetSdk 28), so no source changes to AndroidX are required.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        // libsuperuser and filepicker were published to jcenter, which is gone;
        // their exact AARs and POMs are vendored under app/local-repo. Keeping
        // the original coordinates lets Gradle resolve transitive support
        // libraries normally. See local-repo/README.md for provenance.
        maven { url = uri("$rootDir/local-repo") }
        google()
        mavenCentral()
    }
}
