name: Check vendored updates

on:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-updates:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26.04 during the
    # 2026-10-19..2026-11-19 rollout (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run check_updates
        run: |
          python3 buildtools/scripts/check_updates.py --format json > updates.json
          cat updates.json
          python3 buildtools/scripts/check_updates.py --check-only || echo "::warning::Updates available for vendored libraries — see updates.json"

      - name: Upload updates artifact
        uses: actions/upload-artifact@v7
        with:
          name: vendored-updates
          path: updates.json
          if-no-files-found: warn
