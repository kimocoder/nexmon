name: Nexmon CI

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners are pinned instead of using ubuntu-latest, which migrates to Ubuntu
# 26.04 during the 2026-10-19..2026-11-19 rollout (actions/runner-images#14748).
# The native and firmware builds depend on i386 multiarch packages from 24.04.
jobs:
  lint:
    name: Lint (ruff + shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install ruff
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Ruff (correctness rules, see pyproject.toml)
        run: ruff check .

      - name: Verify IOCTL & Capability Constants Sync
        run: python buildtools/scripts/sync_constants.py --check

      - name: Verify Wrapper Address Collisions & Consistency
        run: python buildtools/scripts/validate_firmware.py --check-wrapper

      - name: Shellcheck
        run: |
          shellcheck -S error setup_env.sh monitor-mode.sh \
            buildtools/*.sh buildtools/scripts/*.sh

      - name: Verify Kernel Driver Integrity & Syntax
        run: python buildtools/scripts/check_drivers.py --check

  test-and-build:
    name: Native Utilities & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-test-${{ runner.os }}-${{ hashFiles('utilities/nexutil/**', 'buildtools/**') }}
          restore-keys: ccache-test-${{ runner.os }}-

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y gcc g++-multilib libc6-i386 libgmp-dev libgmp-dev:i386 make gawk xxd libpcap-dev libnl-3-dev libnl-genl-3-dev libcap-dev linux-headers-generic ccache || \
          sudo apt-get install -y gcc g++-multilib libc6-i386 libgmp-dev make gawk xxd libpcap-dev libnl-3-dev libnl-genl-3-dev libcap-dev ccache
          mkdir -p "$HOME/.ccache"
          ccache --set-config=cache_dir="$HOME/.ccache" || true

      - name: Install Python Test Dependencies
        run: python -m pip install capstone numpy zstandard

      - name: Build Userspace Utilities & Extractors
        # Explicitly select the host compiler on x86 too. The default x86 path
        # builds Android binaries, which cannot serve the native SDK tests.
        run: |
          mkdir -p "$HOME/.ccache"
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          make -C utilities/nexutil NATIVE_BUILD=1
          make -C utilities/dhdutil NATIVE_BUILD=1
          make -C buildtools/flash_patch_extractor
          make -C buildtools/ucode_extractor
          make -C buildtools/gcc-nexmon-plugin

      - name: Compile-Check Kernel Drivers
        run: python buildtools/scripts/check_drivers.py --compile

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

  android:
    name: Android App (assembleDebug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode/versionName are derived from git history; a shallow
          # clone makes rev-list --count report 1. blob:none keeps the full
          # commit graph without downloading historical file contents.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-24.04 image already ships the Android SDK, but its
      # cmdline-tools are not guaranteed on PATH. Wire them up directly:
      # setup-android@v3 still asks sdkmanager for the long-removed "tools"
      # package, which fails the whole job before any project step runs.
      - name: Set up preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-28" "build-tools;30.0.3"

      # Validates the Java/APK build. The JNI helpers under
      # app/app/src/main/external are built separately with the NDK.
      - name: Build debug APK
        working-directory: app
        run: ./gradlew --no-daemon --stacktrace assembleDebug

  android-native:
    name: Android Native (API 21, armeabi-v7a + arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The ubuntu-24.04 image already ships the Android SDK, but its
      # cmdline-tools are not guaranteed on PATH. Wire them up directly:
      # setup-android@v3 still asks sdkmanager for the long-removed "tools"
      # package, which fails the whole job before any project step runs.
      - name: Set up preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true

      # The bundled firmware cross-compiler (x86) and the host tools it drives
      # are 32-bit executables.
      - name: Install NDK and 32-bit firmware build dependencies
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y gcc g++-multilib libc6-i386 libgmp-dev libgmp-dev:i386 make gawk qpdf xxd
          sdkmanager "ndk;30.0.16248370"

      - name: Build host tools and firmware assets
        shell: bash
        run: |
          set -euo pipefail
          touch DISABLE_STATISTICS
          source setup_env.sh
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)}"
          export NDK_ROOT="$ANDROID_NDK_ROOT"
          make -C buildtools
          make -C firmwares/bcm4330/5_90_100_41_sta
          make -C firmwares/bcm4339/6_37_34_43
          make -C firmwares/bcm4358/7_112_200_17_sta

      # Builds the JNI helpers (both ABIs where the source allows it) and every
      # executable asset the APK ships.
      - name: Build native app
        shell: bash
        run: |
          set -euo pipefail
          source setup_env.sh
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)}"
          export NDK_ROOT="$ANDROID_NDK_ROOT"
          for d in libosdep libpcap libsqlite libargp libssl libcrypto \
                   libnexio libnexmon libfakeioctl nexutil socat netcat iw dhdutil mdk4 \
                   rawproxy rawproxyreverse tcpdump aircrack-ng wireless_tools; do
            make -C "utilities/$d" APP_ABI='armeabi-v7a arm64-v8a'
          done
          make -C app/app/src/main

      - name: Verify ABI and API level (armeabi-v7a)
        run: |
          set -euo pipefail
          dirs=$(find app/app/src/main/libs utilities \
            -maxdepth 3 -type d -name armeabi-v7a -not -path '*/.wsdeps/*')
          python3 buildtools/scripts/check_android_abi.py \
            --max-api 21 --abi armeabi-v7a $dirs

      - name: Verify ABI and API level (arm64-v8a)
        run: |
          set -euo pipefail
          dirs=$(find utilities -maxdepth 3 -type d -name arm64-v8a -not -path '*/.wsdeps/*')
          python3 buildtools/scripts/check_android_abi.py \
            --max-api 21 --abi arm64-v8a $dirs

  android-api21-smoke:
    name: Android API 21 Emulator Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The ubuntu-24.04 image already ships the Android SDK, but its
      # cmdline-tools are not guaranteed on PATH. Wire them up directly:
      # setup-android@v3 still asks sdkmanager for the long-removed "tools"
      # package, which fails the whole job before any project step runs.
      - name: Set up preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true

      - name: Install NDK
        run: sdkmanager "ndk;30.0.16248370"

      # The emulator images GitHub hosts are x86. Build the small, dependency-
      # light tools for x86 so the binaries can actually run on the API 21 image;
      # the armeabi-v7a/arm64 output is gated by the android-native job instead.
      - name: Build x86 tools
        shell: bash
        run: |
          set -euo pipefail
          source setup_env.sh
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)}"
          export NDK_ROOT="$ANDROID_NDK_ROOT"
          for d in libnexio libargp libpcap; do
            make -C "utilities/$d" APP_ABI=x86
          done
          for d in nexutil socat netcat iw dhdutil; do
            make -C "utilities/$d" APP_ABI=x86
          done

      - name: Run on API 21
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          disable-animations: true
          script: |
            buildtools/scripts/android_smoke_test.sh \
              utilities/nexutil/libs/x86/nexutil \
              utilities/socat/libs/x86/socat \
              utilities/netcat/libs/x86/nc \
              utilities/iw/libs/x86/iw \
              utilities/dhdutil/libs/x86/dhdutil

  firmware:
    name: Build & Validate BCM43455c0 Firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache ccache and toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            buildtools/gcc-nexmon-plugin/*.so
          key: ccache-firmware-${{ runner.os }}-${{ hashFiles('buildtools/gcc-nexmon-plugin/**', 'patches/bcm43455c0/**') }}
          restore-keys: ccache-firmware-${{ runner.os }}-

      - name: Install Firmware Build Dependencies
        # The bundled x86 GCC 5 toolchain and its plugin are 32-bit executables.
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y gcc g++-multilib libc6-i386 libgmp-dev libgmp-dev:i386 make gawk qpdf xxd ccache || \
          sudo apt-get install -y gcc g++-multilib libc6-i386 libgmp-dev make gawk qpdf xxd ccache
          mkdir -p "$HOME/.ccache"
          ccache --set-config=cache_dir="$HOME/.ccache" || true

      - name: Build Firmware and Require Validation
        shell: bash
        run: |
          set -euo pipefail
          touch DISABLE_STATISTICS
          source setup_env.sh
          export PATH="/usr/lib/ccache:$(dirname "${CC}gcc"):$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -z || true
          make -C buildtools/gcc-nexmon-plugin
          make -C buildtools/flash_patch_extractor
          make -C firmwares/bcm43455c0/7_45_265-28bca26-CY
          make -j$(nproc) -C patches/bcm43455c0/7_45_265-28bca26-CY/nexmon firmware-only NEXMON_FREEZE_BUILD_NUMBER=1
          ccache -s || true
          python buildtools/scripts/validate_firmware.py patches/bcm43455c0/7_45_265-28bca26-CY/nexmon --require

  legacy-firmware:
    name: Build ${{ matrix.dir }} patch
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: bcm43430a1/7_45_41_26
            fw: brcmfmac43430-sdio.bin
            subdir: nexmon
          - dir: bcm43430a1/7_45_41_46
            fw: brcmfmac43430-sdio.bin
            subdir: nexmon
          - dir: bcm43436b0/9_88_4_65
            fw: brcmfmac43436-sdio.bin
            subdir: nexmon
          - dir: bcm43436b0/9_88_0_0
            fw: fw_bcm43436b0.bin
            # Also exercise the ROM+RAM concatenation; this is the target that
            # needs the committed ROM dump to exist at the path ROM_FILE names.
            complete: fw_bcmdhd.complete.bin
            subdir: nexmon
          # Pico W (43439) injection support; the base firmware is generated
          # from the tracked w43439A0_7_95_49_00_combined.h.
          - dir: bcm43439a0/7_95_49_2271bb6
            fw: 43439A0.bin
            subdir: nexmon
          # 4383 has no nexmon/ patch dir; the console patches are built from
          # the extracted ROM in rom_extraction/.
          - dir: bcm4383a3/20_125_24_g0bd14df
            fw: fw_bcmdhd.bin_4383_a3
            subdir: rom_extraction
          # Pixel 10 release r1104089 (PR #689), Magisk-installed ROM patch.
          - dir: bcm4383a3/20_125_5_r1104089
            fw: fw_bcmdhd.bin_4383_a3
            subdir: rom_extraction
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Firmware Build Dependencies
        # Same i386 multiarch set as the bcm43455c0 job: the bundled GCC 5
        # toolchain and its plugin are 32-bit executables. qpdf provides
        # zlib-flate for the ucode compression step.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc g++-multilib libc6-i386 libgmp-dev \
            libgmp-dev:i386 make gawk qpdf xxd

      - name: Build Toolchain Plugin and Extraction Tools
        run: |
          set -euo pipefail
          source setup_env.sh
          make -C buildtools/gcc-nexmon-plugin
          make -C buildtools/flash_patch_extractor
          make -C buildtools/ucode_extractor

      - name: Extract Firmware Components
        run: |
          set -euo pipefail
          source setup_env.sh
          make -C firmwares/${{ matrix.dir }}

      - name: Build Patch
        run: |
          set -euo pipefail
          touch DISABLE_STATISTICS
          source setup_env.sh
          make -C patches/${{ matrix.dir }}/${{ matrix.subdir }} ${{ matrix.fw }}

      - name: Validate Patched Firmware
        # Structural validation: size growth, byte diff, ELF sections,
        # declared/fpconfig overlap, logs, ucode, capability word.
        run: |
          set -euo pipefail
          python3 buildtools/scripts/validate_firmware.py \
            --patch-dir patches/${{ matrix.dir }}/${{ matrix.subdir }} --require

      - name: Build Complete Firmware Image
        # Only targets with a committed ROM dump (matrix.complete set) can
        # produce the flashable ROM+RAM image.
        if: matrix.complete
        run: |
          set -euo pipefail
          source setup_env.sh
          make -C patches/${{ matrix.dir }}/rom_extraction ${{ matrix.complete }}
          img=patches/${{ matrix.dir }}/rom_extraction/${{ matrix.complete }}
          rom=patches/${{ matrix.dir }}/rom_extraction/rom.bin
          test -s "$img"
          # 0x800000 is ROMSTART; the ROM is < 1 MiB so one block is enough.
          dd if="$img" bs=1M skip=8 count=1 status=none | head -c "$(stat -c%s "$rom")" | cmp - "$rom"

  sanitize:
    name: Sanitize (ASan+UBSan) + Fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libpcap-dev
          python -m pip install capstone

      - name: Build rawproxy/rawproxyreverse/libnexio with sanitizers
        run: |
          make -C utilities/rawproxy sanitize
          make -C utilities/rawproxyreverse sanitize
          make -C utilities/libnexio sanitize

      - name: Run radiotap fuzz tests
        run: |
          python -m unittest tests.test_radiotap_fuzz -v
          python -m unittest tests.test_hardening -v
