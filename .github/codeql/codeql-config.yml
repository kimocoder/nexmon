name: "Nexmon CodeQL Configuration"

# Ignore external third-party vendored packages and legacy toolchains
# so CodeQL focuses exclusively on first-party Nexmon code, firmware,
# drivers, utilities, and tests.
paths-ignore:
  - 'utilities/wireshark/**'
  - 'utilities/glib/**'
  - 'utilities/gettext/**'
  - 'utilities/libxml2/**'
  - 'utilities/socat/**'
  - 'utilities/boringssl/**'
  - 'utilities/aircrack-ng/**'
  - 'utilities/libffi/**'
  - 'utilities/zlib/**'
  - 'buildtools/mpfr-*/**'
  - 'buildtools/legacy/**'
  - 'buildtools/isl-*/**'
